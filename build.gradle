plugins {
    id 'java'
    // Версию MDG проверь на https://projects.neoforged.net/neoforged/ModDevGradle (нужна поддержка 26.x)
    id 'net.neoforged.moddev' version '2.0.+'
}

version = mod_version
group = 'com.example.hitboxcam'

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

repositories {
    mavenCentral()
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

processResources {
    var props = [mod_id: mod_id, mod_version: mod_version, neo_version: neo_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}
