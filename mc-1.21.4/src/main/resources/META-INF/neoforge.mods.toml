modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Hitbox & Camera Tweaker"
description = '''
Меняет размер хитбокса, высоту глаз, размер модели игрока и положение камеры. Меню: Esc -> кнопка «Хитбокс и камера» или клавиша H. Если мод стоит и на сервере, размер модели видят все игроки с модом.
'''

[[mixins]]
config = "hitboxcam.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.4,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.4,1.21.5)"
ordering = "NONE"
side = "BOTH"
