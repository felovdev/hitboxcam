name: verify
on:
  push:
    branches: ['fix-1.1.0']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Boot dedicated server
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-type=flat\nspawn-protection=0\n" > run/server.properties
          timeout -s INT 240 gradle runServer --no-daemon > server.log 2>&1 || true
          echo "exit: done"
      - name: Push log
        run: |
          mkdir -p out
          cp server.log out/server.log
          ls run/logs 2>/dev/null && cp run/logs/latest.log out/latest.log || true
          git config user.name "verify-bot"
          git config user.email "bot@example.com"
          git checkout --orphan verify-out
          git rm -rf . >/dev/null 2>&1 || true
          cp -r out/* . 
          git add server.log latest.log 2>/dev/null || git add server.log
          git commit -m "verify log"
          git push -f origin verify-out
