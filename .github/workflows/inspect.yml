name: inspect
on:
  push:
    branches: ['inspect']

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Find NeoForge 21.4 versions
        run: |
          mkdir -p out
          curl -sS https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml -o meta.xml
          grep -o '<version>21\.4\.[^<]*</version>' meta.xml | sed 's/<[^>]*>//g' | tail -15 > out/versions.txt
          cat out/versions.txt
          V=$(grep -v -E 'beta|alpha' out/versions.txt | tail -1)
          [ -z "$V" ] && V=$(tail -1 out/versions.txt)
          echo "chosen $V" >> out/versions.txt
          sed -i "s/^neo_version=.*/neo_version=$V/" mc-1.21.4/gradle.properties
          cat mc-1.21.4/gradle.properties
      - name: Compile skeleton
        run: gradle -p mc-1.21.4 compileJava --no-daemon > out/compile.log 2>&1 || true
      - name: Dump
        run: |
          CP=$(find mc-1.21.4 ~/.gradle -name '*.jar' 2>/dev/null | tr '\n' ':')
          O=out/inspect.txt
          : > $O
          dump() { echo "=== $1" >> $O; javap -p -cp "$CP" "$1" 2>&1 | grep -v -E 'lambda\$' >> $O; }
          for c in net.minecraft.world.entity.player.Player net.minecraft.world.entity.LivingEntity \
                   net.minecraft.world.entity.Entity net.minecraft.world.entity.EntityDimensions \
                   net.minecraft.client.Camera net.minecraft.client.Minecraft \
                   net.minecraft.client.renderer.GameRenderer \
                   net.minecraft.client.gui.screens.PauseScreen net.minecraft.client.gui.screens.Screen \
                   net.minecraft.client.gui.screens.inventory.InventoryScreen \
                   net.minecraft.client.gui.GuiGraphics \
                   net.minecraft.client.gui.components.AbstractSliderButton \
                   net.minecraft.client.gui.components.StringWidget \
                   net.minecraft.client.KeyMapping \
                   net.minecraft.client.renderer.entity.player.PlayerRenderer \
                   net.minecraft.client.renderer.entity.LivingEntityRenderer \
                   net.minecraft.client.renderer.entity.state.LivingEntityRenderState \
                   net.minecraft.client.renderer.entity.state.PlayerRenderState \
                   net.minecraft.network.protocol.common.custom.CustomPacketPayload \
                   net.neoforged.neoforge.network.PacketDistributor \
                   net.neoforged.neoforge.network.registration.PayloadRegistrar \
                   net.neoforged.neoforge.network.handling.IPayloadContext \
                   net.minecraft.resources.ResourceLocation \
                   'net.neoforged.neoforge.client.event.ClientPlayerNetworkEvent$LoggingOut' \
                   net.neoforged.neoforge.client.event.ClientTickEvent \
                   net.neoforged.neoforge.client.event.RegisterKeyMappingsEvent \
                   net.neoforged.neoforge.event.entity.EntityJoinLevelEvent \
                   'net.neoforged.neoforge.event.entity.player.PlayerEvent$PlayerLoggedInEvent' \
                   net.minecraft.server.level.ServerPlayer net.minecraft.server.players.PlayerList \
                   com.mojang.blaze3d.platform.InputConstants ; do dump $c; done
          echo "=== KEY_H" >> $O
          javap -p -constants -cp "$CP" com.mojang.blaze3d.platform.InputConstants | grep -E 'KEY_H;|KEY_H ' >> $O
      - name: Push result
        run: |
          git config user.name "inspect-bot"
          git config user.email "bot@example.com"
          git checkout --orphan inspect-out4
          git rm -rf . >/dev/null 2>&1 || true
          cp out/* .
          git add versions.txt compile.log inspect.txt
          git commit -m "inspect 1.21.4"
          git push -f origin inspect-out4
